name: Deploy

on:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Filter changed paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/deploy.yml'

  deploy-backend:
    name: Deploy Backend (Render)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build backend Docker image (smoke test)
        run: |
          docker build -t fitness-backend:test ./apps/backend

      - name: Trigger Render Deploy
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Render response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Deploy successfully triggered on Render (HTTP $http_code)"
          else
            echo "Failed to trigger deploy on Render (HTTP $http_code)"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Load and validate production API URL
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const dotenv = require('./apps/frontend/node_modules/dotenv')
          const envFile = fs.readFileSync('.vercel/.env.production.local', 'utf8')
          const apiUrl = dotenv.parse(envFile).VITE_API_URL

          if (!apiUrl) {
            throw new Error('VITE_API_URL is missing from Vercel production environment variables')
          }

          const parsedUrl = new URL(apiUrl)
          if (parsedUrl.protocol !== 'https:' || parsedUrl.hostname === 'localhost') {
            throw new Error('VITE_API_URL must be an HTTPS URL for the deployed backend')
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `VITE_API_URL=${apiUrl}\n`)
          NODE

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Prepare Vercel static output
        run: |
          mkdir -p .vercel/output/static
          cp -R apps/frontend/dist/. .vercel/output/static/
          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
