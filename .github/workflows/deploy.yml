name: Deploy

on:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Filter changed paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/deploy.yml'

  deploy-backend:
    name: Deploy Backend (Render)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build backend Docker image (smoke test)
        run: |
          docker build -t fitness-backend:test ./apps/backend

      - name: Trigger Render Deploy
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Render response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Deploy successfully triggered on Render (HTTP $http_code)"
          else
            echo "Failed to trigger deploy on Render (HTTP $http_code)"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Load and validate Render service URL
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const serviceId = process.env.RENDER_SERVICE_ID
          const apiKey = process.env.RENDER_API_KEY

          if (!serviceId || !apiKey) {
            throw new Error('RENDER_SERVICE_ID and RENDER_API_KEY GitHub Actions secrets are required')
          }

          const response = await fetch(
            `https://api.render.com/v1/services/${encodeURIComponent(serviceId)}`,
            { headers: { Authorization: `Bearer ${apiKey}` } },
          )
          if (!response.ok) {
            throw new Error(`Could not retrieve Render service details (HTTP ${response.status})`)
          }

          const service = await response.json()
          const serviceUrl = service.serviceDetails?.url
          if (!serviceUrl) {
            throw new Error('The configured Render service does not provide a public URL')
          }

          const parsedUrl = new URL(serviceUrl)
          if (parsedUrl.protocol !== 'https:') {
            throw new Error('The Render service URL must use HTTPS')
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `VITE_API_URL=${parsedUrl.origin}\n`)
          NODE
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Prepare Vercel static output
        run: |
          mkdir -p .vercel/output/static
          cp -R apps/frontend/dist/. .vercel/output/static/
          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
